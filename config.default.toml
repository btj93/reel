# ScrollWM Configuration
# Edit this file and save — changes apply automatically.

# Start ScrollWM automatically when you log in (requires .app bundle)
# start_at_login = false

[layout]
gap = 16
snap = ["middle"]  # any combination of: "left", "middle", "right"
animation_enabled = true
# floating_opacity = 1.0  # opacity for user-toggled floating windows (0.0–1.0)
# width_presets = [0.33, 0.5, 0.67]  # proportions of screen width for cycle_width

# default_width = { proportion = 0.5 }

# Position memory: remember window positions across close/reopen
# position_memory = true
# saved_position_limit = 500

# Insets for external status bars (e.g., SketchyBar)
# [layout.struts]
# left = 0
# right = 0
# top = 0
# bottom = 0

[animation]
scroll_stiffness = 800
scroll_damping_ratio = 1.0
bounce_distance = 40
bounce_damping_ratio = 0.6

[keybindings]
# Alt (Option) as primary modifier, +Shift for move variants
# Alt+letter consumes special character input (e.g., Alt+H = ˙) — rebind if needed
focus_left = "alt-h"
focus_right = "alt-l"
move_left = "alt-shift-h"
move_right = "alt-shift-l"
cycle_width = "alt-r"
toggle_full_width = "alt-f"
toggle_floating = "alt-space"
close_window = "alt-w"
toggle_always_on_top = "alt-t"

[gesture]
modifier = "fn"  # Hold this key + trackpad scroll to pan the strip
snap = true  # Set to false to let gestures move freely without snapping to columns

# Focus indicator: visual highlight for the active window
# [focus_indicator]
# style = "ring"        # "none", "ring", "raise", or "flash"
# color = "auto"        # "auto" (system accent) or hex "#RRGGBB" / "#RGB"
# width = 3             # border width in points (ring mode only)
# corner_radius = 10    # corner radius in points (ring mode only)

# Zen mode: dim unfocused tiled windows to highlight the focused one
# [zen_mode]
# enabled = false
# dim_alpha = 0.3
# fade_duration = 0.15

# Window rules: match by app bundle ID or title regex
# [[rules]]
# app_id = "us.zoom.xos"
# floating = true

# [[rules]]
# app_id_regex = "com\\.apple\\.systempreferences"
# floating = true

# [[rules]]
# app_id = "com.example.app"
# opacity = 0.9            # override zen mode and floating opacity for this app

# [[rules]]
# app_id = "com.apple.calculator"
# always_on_top = true                # keep this app above all others

# Per-app matching strategy for position memory
# [[position_memory_rules]]
# app_id = "com.apple.finder"
# match_by = "order"  # "title" (default) or "order"

