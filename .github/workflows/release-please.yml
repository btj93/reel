on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      # bundle.sh copies reel-msg in BEFORE signing and verifies the seal, so it is
      # the only step that writes into the bundle. Do not add a post-sign copy here
      # again — that is what shipped releases with an invalid code signature.
      - run: bash scripts/bundle.sh release
      - name: Zip app bundle
        run: |
          cd .build/bundled
          zip -r Reel.app.zip Reel.app
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: .build/bundled/Reel.app.zip
      - name: SHA256 of release zip
        id: sha
        run: echo "sha256=$(shasum -a 256 .build/bundled/Reel.app.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  update-homebrew:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: btj93/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update cask version and sha
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          VERSION="${VERSION#v}"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/reel.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/reel.rb
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/reel.rb
          git commit -m "update reel to ${VERSION#v}"
          git push
