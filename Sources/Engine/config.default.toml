[layout]
gap = 8
default_width = 0.5
width_presets = [0.33, 0.5, 0.67]
snap = ["middle"]

[layout.struts]
top = 0
bottom = 0
left = 0
right = 0

[animation]
enabled = true
stiffness = 800
damping_ratio = 1
bounce_distance = 40
bounce_damping_ratio = 0.6

[keys]
focus_left = "alt-h"
focus_right = "alt-l"
focus_up = "alt-k"
focus_down = "alt-j"
move_left = "alt-shift-h"
move_right = "alt-shift-l"
cycle_width = "alt-r"
toggle_full_width = "alt-f"
toggle_floating = "alt-space"
close_window = "alt-w"

[gesture]
modifier = "fn"
snap = true

[indicator]
style = "ring"
color = "auto"
width = 3
corner_radius = 10
raise_height = 20
