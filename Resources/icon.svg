<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242436" />
      <stop offset="100%" stop-color="#12121A" />
    </linearGradient>

    <linearGradient id="centerWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3A52" />
      <stop offset="100%" stop-color="#252538" />
    </linearGradient>

    <linearGradient id="sideWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2D" />
      <stop offset="100%" stop-color="#151520" />
    </linearGradient>

    <filter id="focusGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <line x1="0" y1="180" x2="512" y2="180" stroke="#FFFFFF" stroke-width="2" opacity="0.05" />
  <line x1="0" y1="332" x2="512" y2="332" stroke="#FFFFFF" stroke-width="2" opacity="0.05" />
  <line x1="0" y1="256" x2="512" y2="256" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" opacity="0.08" />

  <rect x="-60" y="146" width="160" height="220" rx="16" fill="url(#sideWindow)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.15" filter="url(#windowShadow)" />
  <line x1="-60" y1="186" x2="100" y2="186" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.08" />

  <rect x="412" y="146" width="160" height="220" rx="16" fill="url(#sideWindow)" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.15" filter="url(#windowShadow)" />
  <line x1="412" y1="186" x2="572" y2="186" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.08" />

  <rect x="136" y="106" width="240" height="300" rx="24" fill="url(#centerWindow)" filter="url(#windowShadow)" />
  
  <rect x="136" y="106" width="240" height="300" rx="24" fill="none" stroke="#00E5FF" stroke-width="6" filter="url(#focusGlow)" />

  <line x1="136" y1="154" x2="376" y2="154" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.2" />

  <circle cx="168" cy="130" r="7" fill="#FF5F56" />
  <circle cx="192" cy="130" r="7" fill="#FFBD2E" />
  <circle cx="216" cy="130" r="7" fill="#27C93F" />

  <rect x="168" y="186" width="176" height="12" rx="6" fill="#FFFFFF" opacity="0.1" />
  <rect x="168" y="214" width="140" height="12" rx="6" fill="#FFFFFF" opacity="0.1" />
  <rect x="168" y="242" width="156" height="12" rx="6" fill="#FFFFFF" opacity="0.1" />
  <rect x="168" y="270" width="100" height="12" rx="6" fill="#FFFFFF" opacity="0.1" />

  <rect width="512" height="512" rx="115" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.1" />
</svg>

